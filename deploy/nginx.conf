# Site estático carnaval.intertouring.tur.br — atrás do Nginx Proxy Manager (rede nginx-proxy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  # Redirecionamentos relativos: o NPM termina o HTTPS, então nunca gerar http://…:80
  absolute_redirect off;

  # O endereço antigo leva ao novo, com o mesmo caminho (o Cloudflare e o NPM repassam o Host).
  if ($host = page.intertouring.tur.br) { return 301 https://carnaval.intertouring.tur.br$request_uri; }

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  include /etc/nginx/snippets/security-headers.conf;

  # /servicos/ virou parte de /carnaval/ (pedido da cliente, 11/11/2026). O navegador mantém o #âncora.
  location = /servicos { return 301 /carnaval/; }
  location = /servicos/ { return 301 /carnaval/; }

  # Página interna de assinaturas de e-mail (fora do menu e do sitemap). Ela monta a URL das imagens a partir do
  # próprio endereço ("img/"), então precisa abrir com a barra no final. As imagens em /assinaturas/img/ seguem a
  # regra geral de imagens abaixo: públicas, sem checagem de referer (o Gmail as busca pelo Google Image Proxy).
  location = /assinaturas { return 301 /assinaturas/; }
  location = /assinaturas/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /assinaturas/index.html =404;
  }

  # HTML sempre revalidado: um deploy aparece na hora.
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }
  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # CSS e JS levam ?v=<hash do conteúdo> no HTML, então podem ficar em cache por um ano.
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Imagens (inclusive os GIFs das assinaturas de e-mail em /assets/email/), fontes e vídeo: nomes sem hash, cache de 7 dias.
  location ~* \.(?:avif|webp|jpe?g|png|gif|svg|woff2|mp4|webm)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }

  location ~ /\. { deny all; }

  location / {
    try_files $uri $uri/ =404;
  }

  # Endereço inexistente: página 404 de verdade, com status 404 e fora do índice. (Até 26/11/2026 ia com 302 para a
  # página inicial, que o Google lê como "soft 404".) Links e arquivos dela partem da raiz, então serve em qualquer nível.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
  }
}
