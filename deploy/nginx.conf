# Site estático page.intertouring.tur.br — atrás do Nginx Proxy Manager (rede nginx-proxy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  # Redirecionamentos relativos: o NPM termina o HTTPS, então nunca gerar http://…:80
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  include /etc/nginx/snippets/security-headers.conf;

  # HTML sempre revalidado: um deploy aparece na hora.
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }
  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # CSS e JS levam ?v=<hash do conteúdo> no HTML, então podem ficar em cache por um ano.
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Imagens, fontes e vídeo: nomes sem hash, cache de 7 dias.
  location ~* \.(?:avif|webp|jpe?g|png|svg|woff2|mp4|webm)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }

  location ~ /\. { deny all; }

  location / {
    try_files $uri $uri/ =404;
  }

  # Endereço inexistente volta para a página inicial.
  error_page 404 = @home;
  location @home { return 302 /; }
}
